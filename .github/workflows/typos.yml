# Adapted from https://github.com/yegor256/prompt (MIT, Yegor Bugayenko):
# typos spell-check over the repo. Branches adjusted to main+master.
name: typos
'on':
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
jobs:
  typos:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.51.1
