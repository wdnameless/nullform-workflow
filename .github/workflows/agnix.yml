# Adapted from https://github.com/yegor256/prompt (MIT, Yegor Bugayenko):
# agnix strict lint over agent markdown surfaces (agent/, skills/).
# Branches adjusted to main+master.
name: agnix
'on':
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
jobs:
  agnix:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: agent-sh/agnix@v0.59.0
        with:
          strict: true
