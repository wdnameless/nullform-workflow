---
# yamllint disable rule:line-length
name: Repo Gate

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tier:
        description: 'Workflow tier to validate (e.g. T3, T2)'
        type: string
        required: false
        default: 'T3'
      change:
        description: 'OpenSpec change ID (e.g. portable-product-release)'
        type: string
        required: false
        default: 'portable-product-release'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write

jobs:
  build-tarball:
    name: Build Candidate Tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build immutable archive
        run: |
          mkdir -p .tmp
          npm pack --ignore-scripts --pack-destination .tmp
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_NAME="nullform-workflow-${PKG_VERSION}.tgz"
          if [ ! -f ".tmp/${EXPECTED_NAME}" ]; then
            echo "Expected package .tmp/${EXPECTED_NAME} not found"
            exit 1
          fi
          MATCH_COUNT=$(find .tmp -maxdepth 1 -name 'nullform-workflow-*.tgz' -type f | wc -l)
          if [ "$MATCH_COUNT" -ne 1 ]; then
            echo "Expected exactly one candidate tarball, found $MATCH_COUNT"
            exit 1
          fi
          echo "Built candidate tarball: .tmp/${EXPECTED_NAME}"
          (cd .tmp && sha256sum "${EXPECTED_NAME}" > tarball.sha256 && sha512sum "${EXPECTED_NAME}" > tarball.sha512)
          cat .tmp/tarball.sha256
      - name: Upload candidate tarball
        uses: actions/upload-artifact@v4
        with:
          name: candidate-tarball
          path: .tmp/nullform-workflow-*.tgz
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload candidate checksums
        uses: actions/upload-artifact@v4
        with:
          name: candidate-checksums
          path: |
            .tmp/tarball.sha256
            .tmp/tarball.sha512
          include-hidden-files: true
          if-no-files-found: error
  portable-certify:
    name: Certify candidate (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build-tarball
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download candidate tarball
        uses: actions/download-artifact@v4
        with:
          name: candidate-tarball
          path: .tmp
      - name: Download candidate checksums
        uses: actions/download-artifact@v4
        with:
          name: candidate-checksums
          path: .tmp
      - name: Verify downloaded candidate matches producer checksums before certify
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_NAME="nullform-workflow-${PKG_VERSION}.tgz"
          if [ ! -f ".tmp/${EXPECTED_NAME}" ]; then
            echo "Expected candidate .tmp/${EXPECTED_NAME} missing from download"
            exit 1
          fi
          node -e "import('./tools/package-archive.mjs').then(m => { m.verifyChecksumFile('.tmp/tarball.sha256', '.tmp'); m.verifyChecksumFile('.tmp/tarball.sha512', '.tmp'); console.log('Candidate checksums verified via Node crypto'); })"
      - name: Certify candidate archive
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          node tools/certify-package.mjs --tarball ".tmp/nullform-workflow-${PKG_VERSION}.tgz" --output ".tmp/cert-${{ matrix.os }}-node${{ matrix.node }}.json"
      - name: Upload platform certificate
        uses: actions/upload-artifact@v4
        with:
          name: cert-${{ matrix.os }}-node${{ matrix.node }}
          path: .tmp/cert-${{ matrix.os }}-node${{ matrix.node }}.json
          include-hidden-files: true
          if-no-files-found: error

  gate:
    name: Repository Verification Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate OpenSpec changes
        # `npx openspec` is a dead 0.0.0 placeholder with no bin; the real
        # package is @fission-ai/openspec. And validate takes a change ID,
        # not the folder path (a path answers "Unknown item").
        run: |
          BASE='${{ github.base_ref
            || github.event.repository.default_branch }}'
          TMP_DIFF=$(mktemp)
          trap 'rm -f "$TMP_DIFF"' EXIT
          git diff -z --name-only "origin/$BASE"...HEAD \
            -- 'openspec/changes/*' > "$TMP_DIFF"

          SPEC_DIRS=()
          while IFS= read -r -d '' file_path; do
            [ -z "$file_path" ] && continue
            rel="${file_path#openspec/changes/}"
            change_id="${rel%%/*}"
            [ -z "$change_id" ] && continue
            spec_dir="openspec/changes/$change_id"
            already=0
            for s in "${SPEC_DIRS[@]}"; do
              if [ "$s" = "$spec_dir" ]; then
                already=1
                break
              fi
            done
            if [ "$already" -eq 0 ]; then
              SPEC_DIRS+=("$spec_dir")
            fi
          done < "$TMP_DIFF"
          rm -f "$TMP_DIFF"
          trap - EXIT

          if [ "${#SPEC_DIRS[@]}" -eq 0 ]; then
            echo "No openspec/changes modified. Skipping."
          else
            for spec_dir in "${SPEC_DIRS[@]}"; do
              if [ -d "$spec_dir" ]; then
                echo "Validating $spec_dir..."
                CHANGE_ID="${spec_dir##*/}"
                npx --yes @fission-ai/openspec@1.13.2 \
                  validate "$CHANGE_ID" --strict
              fi
            done
          fi
      - name: Run unit & regression tests
        # Unquoted glob on purpose: the shell expands it into explicit paths,
        # which every Node >= 18 accepts. A quoted glob needs >= 22.6, and the
        # bare directory form breaks on Node >= 22 ("Cannot find module").
        # Includes review-integrity native-proof/security consumer regressions.
        run: |
          if [ -d "tools/tests" ]; then
            # Concurrency 2: at 3, network/time-window tests fail on CPU
            # starvation though each file passes in isolation.
            node --test --test-concurrency=2 tools/tests/*.test.mjs
          fi

      - name: Auto-review gate
        run: |
          node tools/auto-review.mjs --root . --json --check '["node","--test","tools/tests/nullform-cli.test.mjs"]'

      - name: Workflow gate validation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
          BASE_REF: '${{ github.base_ref
            || github.event.repository.default_branch }}'
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            node tools/workflow.mjs check-ci --push --base-ref "$PUSH_BASE"
            exit $?
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DISPATCH_TIER="${{ inputs.tier || 'T3' }}"
            DISPATCH_CHANGE="${{ inputs.change || 'portable-product-release' }}"
            echo "Validating workflow_dispatch current-source certification ($DISPATCH_TIER, $DISPATCH_CHANGE)..."
            node tools/workflow.mjs check-ci \
              --tier "$DISPATCH_TIER" --change "$DISPATCH_CHANGE" \
              --base-ref "origin/$BASE_REF" || exit $?
            exit 0
          fi
          TIER_LABELS=$(
            echo "$LABELS_JSON" \
              | jq -r '.[].name // empty' \
              | grep -E '^workflow:T[0-3]$' || true
          )
          LABEL_COUNT=$(echo "$TIER_LABELS" | grep -c . || true)
          if [ "$LABEL_COUNT" -eq 0 ]; then
            echo "::error::PR is missing mandatory workflow tier label."
            exit 1
          fi
          if [ "$LABEL_COUNT" -gt 1 ]; then
            echo "::error::PR carries multiple workflow tier labels."
            exit 1
          fi
          TIER="${TIER_LABELS#workflow:}"
          echo "PR declared workflow tier: $TIER"

          if [ "$TIER" = "T2" ] || [ "$TIER" = "T3" ]; then
            TMP_DIFF=$(mktemp)
            trap 'rm -f "$TMP_DIFF"' EXIT
            git diff -z --name-only "origin/$BASE_REF"...HEAD \
              -- 'openspec/changes/*' > "$TMP_DIFF"

            SPEC_DIRS=()
            while IFS= read -r -d '' file_path; do
              [ -z "$file_path" ] && continue
              rel="${file_path#openspec/changes/}"
              change_id="${rel%%/*}"
              [ -z "$change_id" ] && continue
              spec_dir="openspec/changes/$change_id"
              already=0
              for s in "${SPEC_DIRS[@]}"; do
                if [ "$s" = "$spec_dir" ]; then
                  already=1
                  break
                fi
              done
              if [ "$already" -eq 0 ]; then
                SPEC_DIRS+=("$spec_dir")
              fi
            done < "$TMP_DIFF"
            rm -f "$TMP_DIFF"
            trap - EXIT

            if [ "${#SPEC_DIRS[@]}" -eq 0 ]; then
              echo "::error::Tier $TIER PR needs openspec/changes/<id>."
              exit 1
            fi

            VALIDATED_COUNT=0
            for spec_dir in "${SPEC_DIRS[@]}"; do
              if [ ! -d "$spec_dir" ]; then
                echo "::error::OpenSpec change '$spec_dir' missing/deleted."
                exit 1
              fi
              CHANGE_ID="${spec_dir##*/}"
              if [[ "$CHANGE_ID" =~ [[:space:]] ]] || \
                 ! [[ "$CHANGE_ID" =~ ^[a-zA-Z0-9_-]+$ ]]; then
                echo "::error::Change '$CHANGE_ID' is invalid/has whitespace."
                exit 1
              fi
              echo "Validating workflow CI evidence for $CHANGE_ID ($TIER)..."
              node tools/workflow.mjs check-ci \
                --tier "$TIER" --change "$CHANGE_ID" \
                --base-ref "origin/$BASE_REF" || exit $?
              VALIDATED_COUNT=$((VALIDATED_COUNT + 1))
            done

            if [ "$VALIDATED_COUNT" -eq 0 ]; then
              echo "::error::No OpenSpec change validated for tier $TIER."
              exit 1
            fi
          elif [ "$TIER" = "T1" ]; then
            echo "Validating workflow tier T1..."
            RECON_FILE=""
            for candidate in .workflow-recon.md recon.md; do
              if [ -f "$candidate" ]; then
                RECON_FILE="$candidate"
                break
              fi
            done
            if [ -z "$RECON_FILE" ]; then
              RECON_FILE=$(git diff --name-only \
                "origin/$BASE_REF"...HEAD 2>/dev/null \
                | grep -iE '(^|/)(recon|\.workflow-recon)\.md$' \
                | head -n 1 || true)
            fi
            if [ -n "$RECON_FILE" ]; then
              node tools/workflow.mjs check-ci \
                --tier "$TIER" --base-ref "origin/$BASE_REF" \
                --recon "$RECON_FILE"
            else
              node tools/workflow.mjs check-ci \
                --tier "$TIER" --base-ref "origin/$BASE_REF"
            fi
          else
            echo "Validating lean workflow tier $TIER..."
            node tools/workflow.mjs check-ci \
              --tier "$TIER" --base-ref "origin/$BASE_REF"
          fi

      - name: Code size gate
        # Stops modules growing into god-objects. The baseline records
        # today's offenders; only GROWTH past a baselined size, or a NEW
        # offender, fails. A `defer:` header marker reports but does not fail.
        run: |
          node tools/code-size.mjs check --root .

      - name: ESLint strict gate
        run: npm run lint

      - name: Cognitive complexity ratchet
        # The Node analyzer is a devDependency, so `npm ci` already provides it. The Python
        # rows need pylint + the COCO plugin, which are NOT harness dependencies: install
        # them into a throwaway venv on this disposable runner (never into a developer
        # machine — that is what --allow-host-install exists for and why it is explicit).
        #
        # Only GROWTH past a baselined COCO, or a NEW offender above the threshold, fails.
        # An analyzer that cannot run exits 1 as "unverified", never 0.
        run: |
          if [ ! -f .quality-baseline.json ]; then
            echo "no .quality-baseline.json: quality gate not opted in, skipping"
            exit 0
          fi
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet pylint==4.1.3 pylint-cognitive-complexity==0.1.1
          QUALITY_PYTHON=.venv/bin/python node tools/quality.mjs check --root .

      - name: Agent definition lint
        # Replaces agnix: it validated tool names against the Claude convention while
        # this harness's canon is the OMP vocabulary (read/bash), so it reported
        # defects that did not exist. agent-lint encodes our own contract.
        run: node tools/agent-lint.mjs --check

      - name: Prompt surfaces & cache safety checks
        run: |
          node tools/prompt-lint.mjs scan --root .
          node tools/prompt-lint.mjs skills --check --root .
          FP1=$(node tools/prompt-lint.mjs fingerprint --root .)
          FP2=$(node tools/prompt-lint.mjs fingerprint --root .)
          if [ "$FP1" != "$FP2" ]; then
            echo "Prompt fingerprint is non-deterministic!"
            exit 1
          fi
          if [ -f "tools/tests/fixtures/return-contract/valid.md" ]; then
            node tools/return-contract.mjs \
              tools/tests/fixtures/return-contract/valid.md
          elif [ -f "tools/tests/fixtures/return-contract.fixture.md" ]; then
            node tools/return-contract.mjs \
              tools/tests/fixtures/return-contract.fixture.md
          fi

  bench-smoke:
    name: Benchmark Smoke Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate bench/tasks.json schema
        run: node tools/benchmark.mjs validate-tasks
      - name: Verify smoke red path (expect exit 1)
        run: |
          set +e
          node tools/benchmark.mjs smoke \
            --baseline bench/fixtures/smoke/baseline \
            --candidate bench/fixtures/smoke/candidate
          CODE=$?
          set -e
          if [ "$CODE" -ne 1 ]; then
            echo "Expected smoke red path to exit 1, got $CODE"
            exit 1
          fi
      - name: Verify smoke green path (expect exit 0)
        run: |
          node tools/benchmark.mjs smoke \
            --baseline bench/fixtures/smoke/baseline \
            --candidate bench/fixtures/smoke/candidate \
            --tasks eval-frozen-test-invariance
          node tools/benchmark.mjs smoke \
            --baseline bench/fixtures/smoke/baseline \
            --candidate bench/fixtures/smoke/baseline
      - name: Run benchmark unit tests
        run: node --test tools/tests/benchmark.test.mjs
