# Adapted from https://github.com/yegor256/prompt (MIT, Yegor Bugayenko).
# actionlint over workflows (incl. shell-injection checks).
---
# yamllint disable rule:line-length
name: actionlint
'on':
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
jobs:
  actionlint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: get_actionlint
        run: |
          curl -sSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -sSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          grep "actionlint_1.7.12_linux_amd64.tar.gz" actionlint_1.7.12_checksums.txt | sha256sum --check
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          rm actionlint_1.7.12_linux_amd64.tar.gz actionlint_1.7.12_checksums.txt
          echo "executable=$(pwd)/actionlint" >> "$GITHUB_OUTPUT"
        shell: bash
      - run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash
