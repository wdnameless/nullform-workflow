# Adapted from https://github.com/yegor256/prompt (MIT, Yegor Bugayenko).
# actionlint over workflows (incl. shell-injection checks).
---
# yamllint disable rule:line-length
name: actionlint
'on':
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
jobs:
  actionlint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash
