name: Workflow Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: Architecture & Workflow Verification Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history if needed for diffs / previous commit comparison
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'npm' # Uncomment if root package-lock.json exists

      - name: Install tools dependencies
        # Placeholder / conditional: installs dependencies for tooling if package.json exists in tools/
        run: |
          if [ -f "tools/package.json" ]; then
            npm ci --prefix tools
          fi

      - name: Validate OpenSpec changes
        # Validates only changed change-proposals under openspec/changes/*
        run: |
          CHANGED_SPECS=$(git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD -- 'openspec/changes/*' 2>/dev/null | cut -d/ -f1-3 | sort -u || true)
          if [ -z "$CHANGED_SPECS" ]; then
            echo "No openspec/changes modified. Skipping."
          else
            for spec_dir in $CHANGED_SPECS; do
              if [ -d "$spec_dir" ]; then
                echo "Validating $spec_dir..."
                npx --yes openspec validate "$spec_dir" --strict
              fi
            done
          fi

      - name: Run unit & regression tests
        run: |
          if [ -d "tools/tests" ]; then
            node --test tools/tests/
          fi

      - name: Architecture scan & auto-review
        id: archmap_scan
        run: |
          # 1. Run archmap scan to generate .archmap snapshot & architecture.html
          node tools/archmap.mjs scan --root .

          # 2. Run auto-review gate (checks cycles, critical/high problems, typecheck & lint if configured)
          node tools/auto-review.mjs --root .

      - name: Upload .archmap artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archmap-report
          path: .archmap/
          retention-days: 14

      - name: Check active workflow state
        # Checks workflow state if project is under active workflow execution
        run: |
          if [ -f ".workflow/state.json" ]; then
            echo "Checking .workflow/state.json..."
            node tools/workflow.mjs check
          else
            echo "No active .workflow/state.json found. Skipping."
          fi

      - name: Post PR Comment with Architecture Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let body = '### 🏛️ Archmap Architecture Gate Report\n\n';
            const statePath = path.join(process.env.GITHUB_WORKSPACE, '.archmap', 'state.json');
            const prevPath = path.join(process.env.GITHUB_WORKSPACE, '.archmap', 'previous.json');

            if (fs.existsSync(statePath)) {
              try {
                const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
                const totals = state.totals || {};
                body += `**Файлов:** ${totals.files || 0} | **Строк кода:** ${totals.loc || 0} | **Индекс сопровождаемости (MI):** ${totals.avgMi || 0}/100\n\n`;

                if (state.problems && state.problems.length) {
                  const critical = state.problems.filter(p => p.severity === 'critical').length;
                  const high = state.problems.filter(p => p.severity === 'high').length;
                  const medium = state.problems.filter(p => p.severity === 'medium').length;
                  const low = state.problems.filter(p => p.severity === 'low').length;
                  body += `**Обнаружено проблем:** 🔴 ${critical} крит., 🟠 ${high} выс., 🟡 ${medium} сред., ⚪ ${low} низ.\n\n`;
                } else if (state.cycles && state.cycles.length) {
                  body += `⚠️ **Циклических зависимостей:** ${state.cycles.length}\n\n`;
                } else {
                  body += `✅ Архитектурных проблем не обнаружено.\n\n`;
                }
              } catch (e) {
                body += `Не удалось разобрать .archmap/state.json: ${e.message}\n\n`;
              }
            } else {
              body += 'Отчёт .archmap/state.json не найден.\n\n';
            }

            body += `_Подробный HTML-отчёт сохранён в артефактах сборки (archmap-report)._`;

            // Look for existing comment to update or create a new one
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('Archmap Architecture Gate Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }
