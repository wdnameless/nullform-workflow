name: Workflow Gate

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: Architecture & Workflow Verification Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history if needed for diffs / previous commit comparison
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'npm' # Uncomment if root package-lock.json exists

      - name: Validate OpenSpec changes
        # Validates only changed change-proposals under openspec/changes/*
        # `npx openspec` is a dead 0.0.0 placeholder; the real package is
        # @fission-ai/openspec, and validate takes a change ID, not a path.
        run: |
          BASE='${{ github.base_ref
            || github.event.repository.default_branch }}'
          TMP_DIFF=$(mktemp)
          trap 'rm -f "$TMP_DIFF"' EXIT
          git diff -z --name-only "origin/$BASE"...HEAD \
            -- 'openspec/changes/*' > "$TMP_DIFF"

          SPEC_DIRS=()
          while IFS= read -r -d '' file_path; do
            [ -z "$file_path" ] && continue
            rel="${file_path#openspec/changes/}"
            change_id="${rel%%/*}"
            [ -z "$change_id" ] && continue
            spec_dir="openspec/changes/$change_id"
            already=0
            for s in "${SPEC_DIRS[@]}"; do
              if [ "$s" = "$spec_dir" ]; then
                already=1
                break
              fi
            done
            if [ "$already" -eq 0 ]; then
              SPEC_DIRS+=("$spec_dir")
            fi
          done < "$TMP_DIFF"
          rm -f "$TMP_DIFF"
          trap - EXIT

          if [ "${#SPEC_DIRS[@]}" -eq 0 ]; then
            echo "No openspec/changes modified. Skipping."
          else
            for spec_dir in "${SPEC_DIRS[@]}"; do
              if [ -d "$spec_dir" ]; then
                echo "Validating $spec_dir..."
                CHANGE_ID="${spec_dir##*/}"
                npx --yes @fission-ai/openspec@1.13.2 \
                  validate "$CHANGE_ID" --strict
              fi
            done
          fi

      - name: Run unit & regression tests
        # Unquoted glob: the shell expands it to explicit paths, accepted by
        # every Node >= 18. A quoted glob needs >= 22.6; the bare directory
        # form breaks on Node >= 22 ("Cannot find module").
        # Includes review-integrity native-proof/security consumer regressions.
        run: |
          if [ -d "tools/tests" ]; then
            node --test tools/tests/*.test.mjs
          fi

      - name: Code size gate
        # Stops modules growing into god-objects. The baseline records
        # today's offenders; only GROWTH past a baselined size, or a NEW
        # offender, fails. A `defer:` header marker reports but does not fail.
        run: |
          node tools/code-size.mjs check --root .

      - name: Auto-review gate
        id: auto_review
        run: |
          node tools/auto-review.mjs --root .


      - name: Prompt surfaces & cache safety checks
        run: |
          node tools/prompt-lint.mjs scan --root .
          node tools/prompt-lint.mjs skills --check --root .
          FP1=$(node tools/prompt-lint.mjs fingerprint --root .)
          FP2=$(node tools/prompt-lint.mjs fingerprint --root .)
          if [ "$FP1" != "$FP2" ]; then
            echo "Prompt fingerprint is non-deterministic!"
            exit 1
          fi
          if [ -f "tools/tests/fixtures/return-contract/valid.md" ]; then
            node tools/return-contract.mjs \
              tools/tests/fixtures/return-contract/valid.md
          elif [ -f "tools/tests/fixtures/return-contract.fixture.md" ]; then
            node tools/return-contract.mjs \
              tools/tests/fixtures/return-contract.fixture.md
          fi
      - name: Workflow gate validation
        if: github.event_name == 'pull_request'
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
          BASE_REF: '${{ github.base_ref
            || github.event.repository.default_branch }}'
        run: |
          TIER_LABELS=$(
            echo "$LABELS_JSON" \
              | jq -r '.[].name // empty' \
              | grep -E '^workflow:T[0-3]$' || true
          )
          LABEL_COUNT=$(echo "$TIER_LABELS" | grep -c . || true)
          if [ "$LABEL_COUNT" -eq 0 ]; then
            echo "::error::PR is missing mandatory workflow tier label."
            exit 1
          fi
          if [ "$LABEL_COUNT" -gt 1 ]; then
            echo "::error::PR carries multiple workflow tier labels."
            exit 1
          fi
          TIER="${TIER_LABELS#workflow:}"
          echo "PR declared workflow tier: $TIER"

          if [ "$TIER" = "T2" ] || [ "$TIER" = "T3" ]; then
            TMP_DIFF=$(mktemp)
            trap 'rm -f "$TMP_DIFF"' EXIT
            git diff -z --name-only "origin/$BASE_REF"...HEAD \
              -- 'openspec/changes/*' > "$TMP_DIFF"

            SPEC_DIRS=()
            while IFS= read -r -d '' file_path; do
              [ -z "$file_path" ] && continue
              rel="${file_path#openspec/changes/}"
              change_id="${rel%%/*}"
              [ -z "$change_id" ] && continue
              spec_dir="openspec/changes/$change_id"
              already=0
              for s in "${SPEC_DIRS[@]}"; do
                if [ "$s" = "$spec_dir" ]; then
                  already=1
                  break
                fi
              done
              if [ "$already" -eq 0 ]; then
                SPEC_DIRS+=("$spec_dir")
              fi
            done < "$TMP_DIFF"
            rm -f "$TMP_DIFF"
            trap - EXIT

            if [ "${#SPEC_DIRS[@]}" -eq 0 ]; then
              echo "::error::Tier $TIER PR needs openspec/changes/<id>."
              exit 1
            fi

            VALIDATED_COUNT=0
            for spec_dir in "${SPEC_DIRS[@]}"; do
              if [ ! -d "$spec_dir" ]; then
                echo "::error::OpenSpec change '$spec_dir' missing/deleted."
                exit 1
              fi
              CHANGE_ID="${spec_dir##*/}"
              if [[ "$CHANGE_ID" =~ [[:space:]] ]] || \
                 ! [[ "$CHANGE_ID" =~ ^[a-zA-Z0-9_-]+$ ]]; then
                echo "::error::Change '$CHANGE_ID' is invalid/has whitespace."
                exit 1
              fi
              echo "Validating workflow CI evidence for $CHANGE_ID ($TIER)..."
              node tools/workflow.mjs check-ci \
                --tier "$TIER" --change "$CHANGE_ID" \
                --base-ref "origin/$BASE_REF" || exit $?
              VALIDATED_COUNT=$((VALIDATED_COUNT + 1))
            done

            if [ "$VALIDATED_COUNT" -eq 0 ]; then
              echo "::error::No OpenSpec change validated for tier $TIER."
              exit 1
            fi
          elif [ "$TIER" = "T1" ]; then
            echo "Validating workflow tier T1..."
            RECON_FILE=""
            for candidate in .workflow-recon.md recon.md; do
              if [ -f "$candidate" ]; then
                RECON_FILE="$candidate"
                break
              fi
            done
            if [ -z "$RECON_FILE" ]; then
              RECON_FILE=$(git diff --name-only \
                "origin/$BASE_REF"...HEAD 2>/dev/null \
                | grep -iE '(^|/)(recon|\.workflow-recon)\.md$' \
                | head -n 1 || true)
            fi
            if [ -n "$RECON_FILE" ]; then
              node tools/workflow.mjs check-ci \
                --tier "$TIER" --base-ref "origin/$BASE_REF" \
                --recon "$RECON_FILE"
            else
              node tools/workflow.mjs check-ci \
                --tier "$TIER" --base-ref "origin/$BASE_REF"
            fi
          else
            echo "Validating lean workflow tier $TIER..."
            node tools/workflow.mjs check-ci \
              --tier "$TIER" --base-ref "origin/$BASE_REF"
          fi

      - name: Post PR Comment with Auto-Review Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### Auto-Review Gate Passed',
              '',
              'All quality gates passed successfully.',
            ].join('\n');

            // Look for existing comment to update or create a new one
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const botComment = comments.data.find(
              (comment) =>
                comment.user.type === 'Bot' &&
                comment.body.includes('Auto-Review Gate')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }
