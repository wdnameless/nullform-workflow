name: Workflow Gate

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: Architecture & Workflow Verification Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history if needed for diffs / previous commit comparison
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'npm' # Uncomment if root package-lock.json exists

      - name: Validate OpenSpec changes
        # Validates only changed change-proposals under openspec/changes/*
        # `npx openspec` is a dead 0.0.0 placeholder; the real package is
        # @fission-ai/openspec, and validate takes a change ID, not a path.
        run: |
          BASE='${{ github.base_ref
            || github.event.repository.default_branch }}'
          CHANGED_SPECS=$(
            git diff --name-only "origin/$BASE"...HEAD \
              -- 'openspec/changes/*' 2>/dev/null \
              | cut -d/ -f1-3 | sort -u || true
          )
          if [ -z "$CHANGED_SPECS" ]; then
            echo "No openspec/changes modified. Skipping."
          else
            for spec_dir in $CHANGED_SPECS; do
              if [ -d "$spec_dir" ]; then
                echo "Validating $spec_dir..."
                CHANGE_ID="${spec_dir##*/}"
                npx --yes @fission-ai/openspec@1.13.1 \
                  validate "$CHANGE_ID" --strict
              fi
            done
          fi

      - name: Run unit & regression tests
        # Unquoted glob: the shell expands it to explicit paths, accepted by
        # every Node >= 18. A quoted glob needs >= 22.6; the bare directory
        # form breaks on Node >= 22 ("Cannot find module").
        run: |
          if [ -d "tools/tests" ]; then
            node --test tools/tests/*.test.mjs
          fi

      - name: Auto-review gate
        id: auto_review
        run: |
          node tools/auto-review.mjs --root .

      - name: Workflow gate validation
        if: github.event_name == 'pull_request'
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
          BASE_REF: '${{ github.base_ref
            || github.event.repository.default_branch }}'
        run: |
          TIER_LABELS=$(
            echo "$LABELS_JSON" \
              | jq -r '.[].name // empty' \
              | grep -E '^workflow:T[0-3]$' || true
          )
          LABEL_COUNT=$(echo "$TIER_LABELS" | grep -c . || true)
          if [ "$LABEL_COUNT" -eq 0 ]; then
            echo "::error::PR is missing mandatory workflow tier label."
            exit 1
          fi
          if [ "$LABEL_COUNT" -gt 1 ]; then
            echo "::error::PR carries multiple workflow tier labels."
            exit 1
          fi
          TIER="${TIER_LABELS#workflow:}"
          echo "PR declared workflow tier: $TIER"

          if [ "$TIER" = "T2" ] || [ "$TIER" = "T3" ]; then
            CHANGED_SPECS=$(
              git diff --name-only "origin/$BASE_REF"...HEAD \
                -- 'openspec/changes/*' 2>/dev/null \
                | cut -d/ -f1-3 | sort -u || true
            )
            if [ -z "$CHANGED_SPECS" ]; then
              echo "::error::Tier $TIER PR needs openspec/changes/<id>."
              exit 1
            fi
            for spec_dir in $CHANGED_SPECS; do
              if [ -d "$spec_dir" ]; then
                CHANGE_ID="${spec_dir##*/}"
                echo "Validating workflow CI evidence for $CHANGE_ID ($TIER)..."
                node tools/workflow.mjs check-ci \
                  --tier "$TIER" --change "$CHANGE_ID"
              fi
            done
          else
            echo "Validating lean workflow tier $TIER..."
            node tools/workflow.mjs check-ci --tier "$TIER"
          fi

      - name: Post PR Comment with Auto-Review Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### Auto-Review Gate Passed',
              '',
              'All quality gates passed successfully.',
            ].join('\n');

            // Look for existing comment to update or create a new one
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const botComment = comments.data.find(
              (comment) =>
                comment.user.type === 'Bot' &&
                comment.body.includes('Auto-Review Gate')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }
