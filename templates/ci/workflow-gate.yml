name: Workflow Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: Architecture & Workflow Verification Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history if needed for diffs / previous commit comparison
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'npm' # Uncomment if root package-lock.json exists

      - name: Validate OpenSpec changes
        # Validates only changed change-proposals under openspec/changes/*
        run: |
          CHANGED_SPECS=$(git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD -- 'openspec/changes/*' 2>/dev/null | cut -d/ -f1-3 | sort -u || true)
          if [ -z "$CHANGED_SPECS" ]; then
            echo "No openspec/changes modified. Skipping."
          else
            for spec_dir in $CHANGED_SPECS; do
              if [ -d "$spec_dir" ]; then
                echo "Validating $spec_dir..."
                npx --yes openspec validate "$spec_dir" --strict
              fi
            done
          fi

      - name: Run unit & regression tests
        run: |
          if [ -d "tools/tests" ]; then
            node --test "tools/tests/*.test.mjs"
          fi

      - name: Auto-review gate
        id: auto_review
        run: |
          node tools/auto-review.mjs --root .

      - name: Check active workflow state
        # Checks workflow state if project is under active workflow execution
        run: |
          if [ -f ".workflow/state.json" ]; then
            echo "Checking .workflow/state.json..."
            node tools/workflow.mjs check
          else
            echo "No active .workflow/state.json found. Skipping."
          fi

      - name: Post PR Comment with Auto-Review Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            let body = '### Auto-Review Gate Passed\n\nAll quality gates passed successfully.';

            // Look for existing comment to update or create a new one
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('Auto-Review Gate')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }
